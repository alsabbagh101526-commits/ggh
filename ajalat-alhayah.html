  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;min-height:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}
img,svg{max-width:100%}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.35;margin:0}
p{margin:0 0 .6em}
.wrap{max-width:560px;margin:0 auto;padding:16px 18px 32px}
.wrap.wide{max-width:780px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 10px}
.brand{font-family:var(--f-display);font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px}
.brand i{width:18px;height:18px;border-radius:50%;background:conic-gradient(#12A383 0 12.5%,#2F80ED 0 25%,#E5484D 0 37.5%,#C9971E 0 50%,#D9579B 0 62.5%,#EE7A30 0 75%,#8B6CF0 0 87.5%,#1E9EAE 0)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-width:40px;height:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.btn{border:0;border-radius:999px;padding:14px 22px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s ease, background .2s, box-shadow .2s;min-height:50px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--navy);color:var(--bg);box-shadow:0 10px 24px -12px rgba(24,34,74,.7)}
:root[data-theme="dark"] .btn-primary{color:#0C1330}
.btn-gold{background:var(--gold);color:#1a1405}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-soft{background:var(--violet-soft);color:var(--violet)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.stack>*+*{margin-top:14px}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.center{text-align:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface2)}
.chip.attn{background:rgba(217,67,74,.12);color:var(--danger)}
.chip.grow{background:var(--gold-soft);color:var(--gold)}
.chip.strong{background:var(--emerald-soft);color:var(--emerald)}
.sec-title{font-size:20px;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.sec-title:first-child{margin-top:4px}

/* Home */
.hero{text-align:center;padding-top:8px}
.hero h1{font-size:clamp(34px,9vw,52px);font-weight:700;letter-spacing:0;margin-top:6px;line-height:1.25}
.hero .lead{font-family:var(--f-display);font-size:clamp(18px,4.6vw,22px);color:var(--violet);margin:10px auto 0;max-width:22em;line-height:1.6}
.wheel-hero{width:min(300px,78vw);margin:18px auto 6px;display:block}
.wheel-hero .spin{transform-origin:150px 150px;animation:wheelIn 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes wheelIn{from{transform:rotate(-200deg) scale(.6);opacity:0}to{transform:rotate(0) scale(1);opacity:1}}
.seg{transition:transform .25s}
.intro-text{font-size:17px;line-height:1.95;max-width:30em;margin:0 auto}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--violet-soft);border-radius:var(--r-md);padding:12px 14px;font-size:14px;color:var(--ink)}
.banner{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:var(--r-md);padding:12px 14px;font-size:14.5px}

/* Guide */
.scale{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.scale div{border-radius:var(--r-md);padding:14px 8px;text-align:center;background:var(--surface2)}
.scale b{display:block;font-family:var(--f-display);font-size:28px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.facts b{display:block;font-family:var(--f-display);font-size:24px;color:var(--violet)}

/* Quiz */
.qhead{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.qicon{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:24px;flex:none}
.qhead h2{font-size:20px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--violet),var(--emerald));transition:width .45s cubic-bezier(.2,.8,.2,1)}
.dots{display:flex;gap:5px;margin:12px 0 0}
.dots span{flex:1;height:5px;border-radius:4px;background:var(--surface2);transition:background .3s}
.qcard{margin-top:18px;padding:26px 20px;border-radius:26px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-height:330px;display:flex;flex-direction:column}
.qcard.enter{animation:qIn .35s cubic-bezier(.2,.8,.2,1)}
.qcard.enter-back{animation:qInB .35s cubic-bezier(.2,.8,.2,1)}
@keyframes qIn{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes qInB{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.qnum{font-size:13.5px;color:var(--muted);font-weight:600}
.qtext{font-family:var(--f-display);font-size:clamp(21px,5.6vw,26px);font-weight:500;line-height:1.6;margin:10px 0 22px;flex:1}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 18px;font-size:18px;font-weight:600;text-align:start;transition:border-color .2s,background .2s,transform .12s;min-height:56px}
.opt small{font-size:13px;font-weight:600;color:var(--muted);background:var(--surface2);border-radius:99px;padding:2px 10px}
.opt:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.opt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface))}
.opt.sel small{background:var(--c);color:#fff}
.opt.pop{animation:pop .32s ease}
@keyframes pop{40%{transform:scale(1.03)}}
.why{margin-top:14px;font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.qnav{display:flex;gap:10px;margin-top:16px}
.qnav .btn{flex:1}
.kbd{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}

/* Transition */
.trans{text-align:center;padding-top:20px}
.trans h2{font-size:26px;margin-top:8px}
.imp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.imp button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px;font-weight:600}
.imp button.sel{border-color:var(--violet);background:var(--violet-soft);color:var(--violet)}
.mini-wheel{width:150px;margin:0 auto;display:block}
.burst{animation:burst .6s cubic-bezier(.2,.8,.2,1)}
@keyframes burst{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}

/* Results */
.res-head{text-align:center;padding:6px 0 4px}
.res-head h1{font-size:clamp(24px,6.4vw,32px);line-height:1.5}
.score-big{display:flex;justify-content:center;align-items:baseline;gap:10px;margin-top:12px;font-family:var(--f-display)}
.score-big b{font-size:clamp(56px,16vw,76px);line-height:1;font-weight:700}
.score-big span{font-size:20px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.kpis div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 6px;text-align:center}
.kpis b{display:block;font-family:var(--f-display);font-size:22px}
.kpis small{color:var(--muted);font-size:12.5px}
.radar-box{position:relative;margin:10px auto 0;max-width:460px}
.radar-box svg{display:block;width:100%;height:auto;overflow:visible}
.radar-label{cursor:pointer}
.radar-hit{fill:transparent;cursor:pointer}
.radar-hit:hover{fill:color-mix(in srgb,var(--violet) 8%,transparent)}
.legend{display:grid;gap:8px}
.lg{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;text-align:start;width:100%}
.lg .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px}
.lg .nm{font-weight:600}
.lg .mbar{height:6px;border-radius:9px;background:var(--surface2);margin-top:4px;overflow:hidden}
.lg .mbar i{display:block;height:100%;border-radius:inherit}
.lg .sc{font-family:var(--f-display);font-size:20px;font-weight:600}
.lg .sc small{font-size:12px;color:var(--muted)}
.callout{border-radius:var(--r-lg);padding:18px 18px;background:linear-gradient(135deg,var(--violet-soft),var(--emerald-soft));border:1px solid var(--line)}
.callout h3{font-size:18px;margin-bottom:6px}
.prio{border-inline-start:5px solid var(--c);}
.rep h3{font-size:17.5px;margin:2px 0 6px;display:flex;gap:8px;align-items:center}
.rep p{white-space:pre-line}
.rep .note{background:var(--gold-soft);border-radius:var(--r-md);padding:12px 14px;margin-top:8px}
.ai-out{white-space:normal}
.ai-out h4{font-size:16.5px;margin:14px 0 4px}
.ai-out ul,.ai-out ol{margin:4px 0 8px;padding-inline-start:22px}
.tag-local{display:inline-block;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface2);border-radius:99px;padding:2px 10px}
.quote{font-family:var(--f-display);font-size:18px;line-height:1.95;text-align:center;padding:24px 20px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);margin-top:20px}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.actions .btn{min-height:48px;font-size:15px;padding:10px 12px}

/* Tabs */
.tabs{position:sticky;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);margin-top:24px}
.tabs button{border:0;background:none;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button span{font-size:19px;line-height:1.2}
.tabs button.on{color:var(--violet);background:var(--violet-soft)}
.tabpane{animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Plan */
.phase{border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);padding:18px;box-shadow:var(--shadow)}
.phase+.phase{margin-top:14px}
.phase h3{font-size:18px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph-tag{font-family:var(--f-body);font-size:12.5px;font-weight:600;color:var(--muted)}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.check{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:15px;color:transparent;transition:all .2s}
.check.on{background:var(--emerald);border-color:var(--emerald);color:#fff}
.task .t{flex:1}
.task .t small{display:block;color:var(--muted);font-size:12.5px}
.task.done .t>span{text-decoration:line-through;color:var(--muted)}
.days{display:flex;gap:4px;margin-top:6px}
.days i{width:14px;height:14px;border-radius:4px;background:var(--surface2)}
.days i.on{background:var(--emerald)}
.meter{display:flex;align-items:center;gap:12px}
.meter .bar{flex:1;height:10px}
.field{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:12px 14px;resize:vertical;min-height:80px;line-height:1.7}
.field:focus{outline:none;border-color:var(--violet)}
.opts-time{display:flex;flex-wrap:wrap;gap:8px}
.opts-time button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14.5px}
.opts-time button.sel{border-color:var(--violet);background:var(--violet-soft);color:var(--violet)}

/* Chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:200px}
.msg{max-width:88%;padding:12px 14px;border-radius:18px;font-size:15.5px;line-height:1.85}
.msg.u{align-self:flex-start;background:var(--navy);color:var(--bg);border-end-start-radius:6px}
:root[data-theme="dark"] .msg.u{color:#0C1330}
.msg.a{align-self:flex-end;background:var(--surface);border:1px solid var(--line);border-end-end-radius:6px}
.msg.a .ai-out p:last-child{margin-bottom:0}
.sugs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.sugs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:14px}
.composer{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:72px;background:var(--bg);padding:8px 0}
.composer textarea{flex:1;min-height:48px;max-height:140px;resize:none;border:1.5px solid var(--line);border-radius:18px;padding:11px 14px;background:var(--surface)}
.composer textarea:focus{outline:none;border-color:var(--violet)}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}

/* Progress */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:14px 6px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.badge b{display:block;font-size:28px;filter:grayscale(1);opacity:.35}
.badge.on b{filter:none;opacity:1}
.badge small{font-size:12.5px;font-weight:600;display:block;line-height:1.5;margin-top:4px}
.badge.on{border-color:color-mix(in srgb,var(--gold) 50%,var(--line));background:linear-gradient(180deg,var(--gold-soft),var(--surface))}
.hist{width:100%;border-collapse:collapse;font-size:14.5px}
.hist td,.hist th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start}
.hist th{font-weight:600;color:var(--muted);font-size:13px}
.up{color:var(--emerald);font-weight:600}.down{color:var(--danger);font-weight:600}
.tbl-wrap{overflow-x:auto}

/* Sheet & modal */
.scrim{position:fixed;inset:0;background:rgba(8,12,30,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:26px;max-height:84vh}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.qedit{padding:12px 0;border-top:1px solid var(--line)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.seg3 button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;font-size:14px;font-weight:600}
.seg3 button.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,var(--surface))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14.5px;z-index:60;box-shadow:var(--shadow);animation:up .3s;max-width:90vw;text-align:center}
:root[data-theme="dark"] .toast{color:#0C1330}
.chip.na{background:var(--surface2);color:var(--muted)}
.opt-na{border-style:dashed;font-size:15.5px;min-height:48px;color:var(--muted)}
.opt-na.sel{color:var(--ink)}
.seg3.seg4{grid-template-columns:repeat(4,1fr)}
.seg3.seg4 button{font-size:12.5px;padding:6px 2px}
.team-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface2);margin:4px 0 2px}
.team-bar i{display:block;height:100%}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
#print{display:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (min-width:760px){
  .res-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start}
}
@media print{
  body{background:#fff;color:#000}
  body.printing #app, body.printing .toast, body.printing .scrim{display:none!important}
  body.printing #print{display:block}
}
#print{font-family:var(--f-body);color:#141B3A;padding:10px 24px}
#print h1{font-size:24px}#print h2{font-size:18px;margin:18px 0 6px;border-bottom:1px solid #ddd;padding-bottom:4px}
#print table{width:100%;border-collapse:collapse;font-size:14px}#print td,#print th{border:1px solid #ddd;padding:5px 8px;text-align:start}
#print p{white-space:pre-line}
#print .rsvg{width:340px;margin:0 auto;display:block}
</style>

    { t: "أشعر أن إنجازاتي الحالية تتوافق مع ما أريده من حياتي.", why: "يقيس رضاك عن الاتجاه، لا عن حجم الإنجاز فقط." },
    { t: "أراجع أهدافي وتقدّمي بشكل دوري.", why: "المراجعة الدورية من أقوى عوامل الاستمرار." },
    { t: "أتعامل مع الضغوط اليومية دون أن تسيطر على يومي.", why: "إدارة الضغط تؤثر في جميع الجوانب معاً." },
    { t: "أتحكم في وقت الجوال ووسائل التواصل ولا تستهلك يومي.", why: "المشتتات من أكثر ما يستهلك الوقت المخصص للتطوير." },
    { t: "أطلب المساعدة عندما أحتاجها.", why: "طلب الدعم يسرّع التغيير ويخفف العبء." },
    { t: "أشعر بالرضا عن حياتي بشكل عام.", why: "يتيح مقارنة شعورك العام بصورة العجلة." },
  ];

  const THEMES = {
    learn: "التعلم والقراءة",
    plan: "التخطيط ووضع الأهداف",
    routine: "العادات اليومية المنتظمة",
    bond: "العلاقات والتواصل",
    rest: "الراحة وتجديد الطاقة",
    mind: "الوعي الذاتي والحدود",
  };

  // pairs of [knowledge question idx], [practice question idx]
  const KP = {
    hea: { k: [7, 9], p: [0, 1, 8] },
    fin: { k: [6], p: [2, 4] },
    fam: { k: [2, 7], p: [3, 4] },
  };

  const CATS = {
    attn: { key: "attn", title: "جانب يحتاج إلى اهتمام", text: "هذا الجانب يحتاج منك إلى اهتمام أكبر وتركيز على تطويره؛ فقد يؤثر إهماله على توازنك العام ويجعل عجلة حياتك أقل انسجاماً." },
    grow: { key: "grow", title: "مساحة للنمو والتطور", text: "لديك أساس جيد في هذا الجانب، لكن لا تزال هناك فرص للتحسين. يمكنك أن تصبح أكثر تميزاً فيه من خلال خطوات عملية منتظمة." },
    strong: { key: "strong", title: "نقطة قوة", text: "هذا الجانب من نقاط قوتك الحالية. حافظ على ما حققته، واستثمر هذه القوة لدعم بقية جوانب حياتك." },
  };
  const ANS = ["لا يصفني", "أحياناً", "يصفني"];
  const NA_LABEL = "لا يخص وضعي الحالي";
  // questions that may not apply to everyone's circumstances (no job, no income, medical exemption)
  const NA_OK = new Set(["rel-5", "fin-0", "fin-2"].concat(Array.from({ length: 10 }, (_, i) => "wor-" + i)));
  const NA_CAT = { key: "na", title: "لا ينطبق حالياً", text: "أشرت إلى أن أغلب أسئلة هذا الجانب لا تخص وضعك الحالي، لذلك لم يُحتسب في المجموع ولا في التحليل." };
  const ansLabel = (v) => (v === "na" ? NA_LABEL : ANS[v]);
  const TIMES = [
    { id: "5", label: "5 دقائق", gain: 2 },
    { id: "15", label: "15 دقيقة", gain: 3 },
    { id: "30", label: "30 دقيقة", gain: 4 },
    { id: "60", label: "ساعة", gain: 5 },
    { id: "flex", label: "حسب ظروفي", gain: 3 },
  ];
  const IMPORTANCE = { 1: "منخفضة", 2: "متوسطة", 3: "عالية" };

  const CONCERN_KEYS = {
    rel: ["صلاه", "قران", "ديني", "تدين", "عباده", "ايمان", "روحان", "اذكار", "صيام"],
    soc: ["اصدقاء", "صديق", "اجتماع", "علاقات", "جيران", "الناس", "عزله", "وحده"],
    hea: ["صح", "رياض", "وزن", "نوم", "اكل", "غذاء", "لياقه", "تعب", "طاقه", "جسم", "سمنه"],
    fin: ["مال", "فلوس", "راتب", "دخل", "ادخار", "ديون", "قرض", "مصاريف", "مصروف", "استثمار", "توفير"],
    lei: ["ترفيه", "فراغ", "ملل", "هوايه", "هوايات", "استمتاع", "متعه", "سفر", "استرخاء"],
    fam: ["اسره", "عائل", "اهلي", "زوج", "ابناء", "اولاد", "عيال", "والد", "امي", "ابوي", "ابي", "اخوان", "اخوتي", "البيت"],
    per: ["ثقه", "شخصيت", "حوار", "تفاؤل", "ايجابي", "خجل", "التعامل مع الناس", "مهاراتي"],
    wor: ["عمل", "وظيف", "مهن", "ترقي", "دوام", "مدير", "شغل", "مسار", "تخصص", "دورات"],
  };

  const norm = (s) => String(s || "")
    .replace(/[\u064B-\u0652\u0640]/g, "")
    .replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").toLowerCase();

  const key = (d, i) => d + "-" + i;
  const cat = (s) => (s <= 10 ? CATS.attn : s <= 15 ? CATS.grow : CATS.strong);
  const dom = (id) => DOMAINS.find((d) => d.id === id);

  function countAnswered(answers) {
    let n = 0;
    DOMAINS.forEach((d) => d.qs.forEach((_, i) => { if (answers[key(d.id, i)] !== undefined) n++; }));
    return n;
  }

  function scoreDomains(answers) {
    const out = {};
    DOMAINS.forEach((d) => {
      let s = 0, n = 0, na = 0, zeros = [], ones = [], twos = [];
      d.qs.forEach((q, i) => {
        const v = answers[key(d.id, i)];
        if (v === undefined) return;
        n++;
        if (v === "na") { na++; return; }
        s += v;
        (v === 0 ? zeros : v === 1 ? ones : twos).push(i);
      });
      const applicable = 10 - na, excluded = applicable < 5;
      const score = excluded ? 0 : na ? Math.round((s * 10) / applicable) : s;
      out[d.id] = { id: d.id, score, raw: s, answered: n, na, applicable, excluded, scaled: na > 0 && !excluded, zeros, ones, twos, cat: excluded ? NA_CAT : cat(score) };
    });
    return out;
  }

  function detectConcern(text) {
    const t = norm(text);
    if (!t.trim()) return null;
    let best = null, bestN = 0;
    for (const id in CONCERN_KEYS) {
      const n = CONCERN_KEYS[id].reduce((a, k) => a + (t.includes(k) ? 1 : 0), 0);
      if (n > bestN) { bestN = n; best = id; }
    }
    return best;
  }

  const listQs = (d, idxs, max) => idxs.slice(0, max).map((i) => "«" + d.qs[i].t.replace(/\.$/, "") + "»").join("، ");
  const nm = (id) => "الجانب " + dom(id).name;

  function analyze(input) {
    const answers = input.answers || {};
    const extra = input.extra || {};
    const importance = input.importance || {};
    const sc = scoreDomains(answers);
    const ids = DOMAINS.map((d) => d.id).filter((id) => !sc[id].excluded);
    const excluded = DOMAINS.map((d) => d.id).filter((id) => sc[id].excluded);
    const scaled = ids.filter((id) => sc[id].scaled);
    const maxTotal = ids.length * 20;
    const total = ids.reduce((a, id) => a + sc[id].score, 0);
    const answered = countAnswered(answers);
    const numeric = ids.reduce((a, id) => a + sc[id].answered - sc[id].na, 0);
    const rawActive = ids.reduce((a, id) => a + sc[id].raw, 0);
    const percent = maxTotal ? Math.round((total / maxTotal) * 100) : 0;
    const vals = ids.map((id) => sc[id].score);
    const max = Math.max(...vals), min = Math.min(...vals);
    const spread = max - min;
    const mean = total / ids.length;
    const sd = Math.sqrt(vals.reduce((a, v) => a + (v - mean) * (v - mean), 0) / ids.length);
    const balance = Math.round(Math.max(0, 1 - sd / 10) * 100);
    const top = ids.filter((id) => sc[id].score === max);
    const bottom = ids.filter((id) => sc[id].score === min);
    const strong = ids.filter((id) => sc[id].score >= 16).sort((a, b) => sc[b].score - sc[a].score);
    const attn = ids.filter((id) => sc[id].score <= 10).sort((a, b) => sc[a].score - sc[b].score);
    const grow = ids.filter((id) => sc[id].score >= 11 && sc[id].score <= 15).sort((a, b) => sc[a].score - sc[b].score);
    const zerosAll = ids.reduce((a, id) => a + sc[id].zeros.length, 0);
    const onesAll = ids.reduce((a, id) => a + sc[id].ones.length, 0);
    const overallRatio = numeric ? rawActive / (numeric * 2) : 0;

    // themes
    const themes = {};
    for (const t in THEMES) themes[t] = { id: t, label: THEMES[t], pts: 0, n: 0, low: [], high: [], domains: new Set() };
    DOMAINS.forEach((d) => d.qs.forEach((q, i) => {
      const v = answers[key(d.id, i)];
      if (v === undefined || v === "na" || sc[d.id].excluded) return;
      q.tags.forEach((t) => {
        const th = themes[t];
        th.pts += v; th.n++; th.domains.add(d.id);
        if (v === 0) th.low.push([d.id, i]);
        if (v === 2) th.high.push([d.id, i]);
      });
    }));
    for (const t in themes) {
      const th = themes[t];
      th.ratio = th.n ? th.pts / (th.n * 2) : 0;
      th.diff = th.ratio - overallRatio;
    }

    // insights
    const insights = [];
    const qref = (pair) => "«" + dom(pair[0]).qs[pair[1]].t.replace(/\.$/, "") + "» (" + nm(pair[0]) + ")";
    for (const t in themes) {
      const th = themes[t];
      if (th.n < 4 || th.domains.size < 2) continue;
      if (th.diff <= -0.18 && th.low.length >= 2) {
        const ex = th.low.slice(0, 3).map(qref).join("، ");
        insights.push({ w: 3 + Math.abs(th.diff) * 10, kind: "theme-low", theme: t,
          text: "هناك خيط مشترك يمتد عبر أكثر من جانب: الأسئلة المرتبطة بـ«" + th.label + "» جاءت أقل من مستواك العام بوضوح (" + Math.round(th.ratio * 100) + "٪ مقابل " + Math.round(overallRatio * 100) + "٪). من أمثلتها في إجاباتك: " + ex + ". تحسين هذا الخيط وحده قد ينعكس على عدة جوانب في الوقت نفسه." });
      } else if (th.diff >= 0.18 && th.high.length >= 3 && bottom.length) {
        const weak = bottom[0];
        insights.push({ w: 2 + th.diff * 8, kind: "theme-high", theme: t,
          text: "«" + th.label + "» تبدو قوة مشتركة لديك تظهر في أكثر من جانب (" + Math.round(th.ratio * 100) + "٪ مقابل متوسطك " + Math.round(overallRatio * 100) + "٪). يمكنك توظيف هذه القوة نفسها في " + nm(weak) + "، فهو الأقل درجة لديك." });
      }
    }
    if (numeric >= 40 && onesAll / numeric >= 0.3) {
      const byOnes = ids.slice().sort((a, b) => sc[b].ones.length - sc[a].ones.length)[0];
      insights.push({ w: 3.2, kind: "ones",
        text: "اخترت «أحياناً» في " + onesAll + " سؤالاً، وأكثرها في " + nm(byOnes) + " (" + sc[byOnes].ones.length + " أسئلة). هذه منطقة قريبة من التحوّل: تحويل «أحياناً» إلى «يصفني» أسهل غالباً من البدء من الصفر، لأن العادة موجودة لكنها غير منتظمة." });
    }
    for (const id in KP) {
      if (sc[id].excluded) continue;
      const kv = KP[id].k.map((i) => answers[key(id, i)]).filter((v) => typeof v === "number");
      const pv = KP[id].p.map((i) => answers[key(id, i)]).filter((v) => typeof v === "number");
      if (!kv.length || !pv.length) continue;
      const ka = kv.reduce((a, b) => a + b, 0) / kv.length, pa = pv.reduce((a, b) => a + b, 0) / pv.length;
      if (ka - pa >= 1) insights.push({ w: 3 + (ka - pa), kind: "know-gap", domain: id,
        text: "في " + nm(id) + " تبدو معرفتك أعلى من تطبيقك: إجاباتك عن أسئلة المعرفة والاطلاع أعلى من إجاباتك عن أسئلة الممارسة. أي أن العائق هنا غالباً ليس نقص المعلومة، بل تحويلها إلى عادة صغيرة ثابتة." });
      else if (pa - ka >= 1) insights.push({ w: 2 + (pa - ka), kind: "practice-gap", domain: id,
        text: "في " + nm(id) + " تمارس أكثر مما تقرأ وتتعلم. هذا جيد، وقليل من المعرفة المنظمة قد يساعدك على الاستمرار وتجنّب الأخطاء الشائعة." });
    }
    ids.forEach((id) => {
      if (importance[id] === 3 && sc[id].score <= 12) insights.push({ w: 4.5, kind: "importance", domain: id,
        text: "أشرت إلى أن " + nm(id) + " مهم جداً لك في هذه المرحلة، لكن درجته " + sc[id].score + " من 20. هذه الفجوة بين الأهمية والواقع تستحق أن تبدأ بها قبل غيرها." });
    });
    if (answered === 80 && spread >= 8) insights.push({ w: 2.5 + spread / 10, kind: "spread",
      text: "الفارق بين أقوى جوانبك (" + top.map(nm).join(" و") + ": " + max + ") وأضعفها (" + bottom.map(nm).join(" و") + ": " + min + ") يبلغ " + spread + " نقاط. هذا التفاوت يعني أن جزءاً من وقتك وطاقتك يتجه إلى جوانب بعينها، وهو ما يجعل العجلة أقل انسجاماً حتى لو كان مجموعك جيداً." });
    if (answered === 80 && spread <= 3 && percent < 75) insights.push({ w: 2.2, kind: "even",
      text: "جوانبك متقاربة جداً (الفارق " + spread + " نقاط فقط). العجلة متوازنة الشكل، لكن حجمها يمكن أن يكبر: التحسين هنا يأتي من رفع الجميع خطوة صغيرة، لا من إنقاذ جانب واحد." });
    const ex = (i) => extra[i];
    const exN = Object.keys(extra).length;
    if (exN) {
      if (ex(0) === 0) insights.push({ w: 4, kind: "extra", text: "أجبت بأن وقتك لا يعكس أولوياتك الحقيقية. هذا مؤشر مهم: قد لا تكون المشكلة في عدد الجوانب الضعيفة، بل في توزيع الوقت. جرّب أن تراقب يومين كيف يذهب وقتك قبل أن تضيف أي عادة جديدة." });
      if (ex(3) === 0 && sc.lei.score <= 10) insights.push({ w: 3.6, kind: "extra", text: "إجابتك بأنك لا تمنح نفسك راحة كافية تتفق مع انخفاض الجانب الترفيهي (" + sc.lei.score + " من 20). الإشارتان معاً تقولان إن الراحة ليست رفاهية في حالتك، بل شرط للاستمرار في أي خطة." });
      if (ex(2) === 0) insights.push({ w: 3, kind: "extra", text: "ذكرت أنك لا تستطيع غالباً قول «لا» عند تعارض الطلبات مع احتياجاتك. أي خطة تطوير ستحتاج إلى وقت محمي، لذلك قد يكون تعلم الرفض اللطيف خطوة تمهيدية مفيدة." });
      if (ex(9) === 2 && percent < 50 && answered === 80) insights.push({ w: 3.4, kind: "extra", text: "رضاك العام عن حياتك أعلى من صورة العجلة (" + percent + "٪). قد يعني هذا أن الجوانب الأهم لك هي الأقوى، أو أن بعض الأسئلة لا تعبر عن أولوياتك. حدّد أهمية كل جانب في تفاصيله لتصبح الأولوية المقترحة أدق." });
      if (ex(9) === 0 && percent >= 70 && answered === 80) insights.push({ w: 3.8, kind: "extra", text: "عجلتك جيدة نسبياً (" + percent + "٪)، لكن رضاك العام منخفض. قد يكون ما يشغلك فعلاً خارج ما تقيسه الأسئلة؛ اكتبه في خانة «ما أكثر شيء يشغلك» لتتكيف الخطة معه." });
    }
    insights.sort((a, b) => b.w - a.w);

    // priority
    const concernDomain = detectConcern(input.concern);
    const impF = { 1: 0.7, 2: 1, 3: 1.4 };
    const pr = ids.map((id) => {
      let p = (20 - sc[id].score) * (impF[importance[id]] || 1) + sc[id].zeros.length * 0.4;
      if (id === concernDomain) p += 6;
      return { id, p };
    }).sort((a, b) => b.p - a.p || sc[a.id].score - sc[b.id].score);
    const prio = pr[0].id;
    const reasons = [];
    const ps = sc[prio];
    if (prio === concernDomain) reasons.push("يرتبط بما كتبته أنه يشغلك حالياً");
    if (ps.score === min) reasons.push("درجته " + ps.score + " من 20، وهي الأدنى بين جوانبك");
    else reasons.push("درجته " + ps.score + " من 20");
    if (ps.zeros.length) reasons.push("فيه " + ps.zeros.length + " إجابات «لا يصفني»، ما يعني وجود خطوات واضحة يمكن البدء بها");
    else if (ps.ones.length) reasons.push("فيه " + ps.ones.length + " إجابات «أحياناً» قريبة من التحول إلى عادة ثابتة");
    if (importance[prio] === 3) reasons.push("وصفت أهميته لك بأنها عالية");
    const linked = insights.find((x) => x.domain === prio || (x.theme && dom(prio).qs.some((q) => q.tags.includes(x.theme))));
    const second = pr.find((x) => x.id !== prio).id;

    // general picture
    let general;
    if (percent >= 80) general = "حصلت على " + total + " من " + maxTotal + " (" + percent + "٪). صورتك العامة متينة، وأغلب جوانب حياتك تسير بانتظام.";
    else if (percent >= 55) general = "حصلت على " + total + " من " + maxTotal + " (" + percent + "٪). لديك أساس جيد في عدد من الجوانب، مع مساحات واضحة للنمو.";
    else if (percent >= 35) general = "حصلت على " + total + " من " + maxTotal + " (" + percent + "٪). بعض الجوانب مستقرة، وأكثر من جانب ينتظر اهتماماً منك.";
    else general = "حصلت على " + total + " من " + maxTotal + " (" + percent + "٪). عدة جوانب تحتاج إلى اهتمام الآن، وهذا ليس حكماً عليك، بل نقطة بداية واضحة تعرف منها أين تبدأ.";
    const cn = (n, one, two, many) => (n === 1 ? one : n === 2 ? two : n + " " + many);
    const parts = [];
    if (strong.length) parts.push(cn(strong.length, "نقطة قوة واحدة", "نقطتا قوة", "نقاط قوة"));
    if (grow.length) parts.push(cn(grow.length, "جانب واحد", "جانبان", "جوانب") + " في مساحة النمو");
    if (attn.length) parts.push(cn(attn.length, "جانب واحد يحتاج", "جانبان يحتاجان", "جوانب تحتاج") + " إلى اهتمام");
    general += " لديك " + parts.join("، و") + "." + (attn.length ? "" : " ولا يوجد جانب في نطاق «يحتاج إلى اهتمام».");
    if (excluded.length) general += " لم يُحتسب " + excluded.map(nm).join(" و") + " لأنك أشرت إلى أن أغلب أسئلته لا تخص وضعك الحالي، لذلك المجموع من " + maxTotal + " بدلاً من 160.";
    if (scaled.length) general += " وفي " + scaled.map(nm).join(" و") + " احتُسبت الدرجة نسبةً إلى الأسئلة التي تنطبق عليك فقط.";
    general += spread >= 8 ? " مؤشر التوازن " + balance + "٪، والتفاوت بين جوانبك كبير نسبياً." : spread <= 3 ? " مؤشر التوازن " + balance + "٪، وجوانبك متقاربة." : " مؤشر التوازن " + balance + "٪.";

    const strengthsText = strong.length
      ? strong.map((id) => nm(id) + " (" + sc[id].score + "/20): اخترت «يصفني» في " + sc[id].twos.length + " من " + sc[id].applicable + " أسئلة.").join("\n")
      : "لا يوجد جانب بلغ 16 بعد. أقرب جوانبك لذلك " + top.map(nm).join(" و") + " (" + max + "/20)" +
        (sc[top[0]].twos.length ? "، ومن أبرز ما يدعمه: " + listQs(dom(top[0]), sc[top[0]].twos, 2) + "." : ".");

    const attnList = attn.length ? attn : grow.slice(0, 2);
    const attnText = attnList.length
      ? attnList.map((id) => {
          const s = sc[id], d = dom(id);
          const det = s.zeros.length ? "اخترت «لا يصفني» في: " + listQs(d, s.zeros, 3) + (s.zeros.length > 3 ? " وغيرها" : "")

    x.font = "500 46px " + F.d; const sm = " / " + data.maxTotal; const sw = x.measureText(sm).width;
    const sx = W / 2 - (bw + sw) / 2;
    txt(big, sx + bw / 2, 372, "700 120px " + F.d, "#FFFFFF", "center", "ltr");

    // radar
    const cx = W / 2, cy = 800, R = 205, n = 8, A = (i) => -Math.PI / 2 + i * (Math.PI / 4);
    const P = (i, v) => [cx + R * (v / 20) * Math.cos(A(i)), cy + R * (v / 20) * Math.sin(A(i))];
    x.lineWidth = 2; x.strokeStyle = "rgba(255,255,255,0.13)";
    [5, 10, 15, 20].forEach((v) => { x.beginPath(); for (let i = 0; i < n; i++) { const p = P(i, v); i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]); } x.closePath(); x.stroke(); });
    for (let i = 0; i < n; i++) { const p = P(i, 20); x.beginPath(); x.moveTo(cx, cy); x.lineTo(p[0], p[1]); x.stroke(); }
    const act = data.domains.map((d, i) => [d, i]).filter((e) => !e[0].excluded);
    x.beginPath(); act.forEach((e, k) => { const p = P(e[1], e[0].score); k ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1]); }); x.closePath();
    x.fillStyle = "rgba(156,144,245,0.34)"; x.fill(); x.lineWidth = 5; x.strokeStyle = "#B3A9FA"; x.lineJoin = "round"; x.stroke();
    act.forEach((e) => { const p = P(e[1], e[0].score); x.beginPath(); x.arc(p[0], p[1], 11, 0, Math.PI * 2); x.fillStyle = e[0].color; x.fill(); x.lineWidth = 4; x.strokeStyle = "#0C1330"; x.stroke(); });
    data.domains.forEach((d, i) => {
      const lx = cx + (R + 84) * Math.cos(A(i)), ly = cy + (R + 84) * Math.sin(A(i));

    });

    const bx = 90, by = 1172, bw2 = W - 180, bh = 100, r = 50;
    x.beginPath(); x.moveTo(bx + r, by); x.arcTo(bx + bw2, by, bx + bw2, by + bh, r); x.arcTo(bx + bw2, by + bh, bx, by + bh, r); x.arcTo(bx, by + bh, bx, by, r); x.arcTo(bx, by, bx + bw2, by, r); x.closePath();
    x.fillStyle = "rgba(230,188,76,0.16)"; x.fill();
    txt("أبدأ الآن بـ" + data.prio, W / 2, by + 66, "600 38px " + F.b, "#E6BC4C");
    txt("اكتشف توازنك، افهم ذاتك، وابدأ رحلة التطوير.", W / 2, 1318, "400 28px " + F.b, "#A4ABCB");
  }

  return { drawCard, DOMAINS, EXTRA, THEMES, CATS, ANS, NA_LABEL, NA_OK, NA_CAT, ansLabel, TIMES, IMPORTANCE, key, cat, dom, norm,
    countAnswered, scoreDomains, analyze, buildPlan, detectConcern, extraCat, addDays };
})();

<script>

(() => {

  const answered = () => LW.countAnswered(S.answers);

  /* ---------- helpers ---------- */

  }

  /* ---------- wheel graphics ---------- */
  function arcPath(cx, cy, r1, r2, a0, a1) {
    const p = (r, a) => [(cx + r * Math.cos(a)).toFixed(2), (cy + r * Math.sin(a)).toFixed(2)];
    const [x0, y0] = p(r2, a0), [x1, y1] = p(r2, a1), [x2, y2] = p(r1, a1), [x3, y3] = p(r1, a0);
    return "M" + x0 + " " + y0 + "A" + r2 + " " + r2 + " 0 0 1 " + x1 + " " + y1 + "L" + x2 + " " + y2 + "A" + r1 + " " + r1 + " 0 0 0 " + x3 + " " + y3 + "Z";
  }

      '</g><circle cx="150" cy="150" r="' + (o.inner - 8) + '" fill="var(--surface)" stroke="var(--line)"/>' + o.hub + "</svg>";

  // radar
  const RC = 200, RR = 118;

  let EXC = Array(8).fill(false);
  const ptsStr = (vals, exc) => vals.map((v, i) => ((exc || EXC)[i] ? null : pt(i, v).map((n) => n.toFixed(2)).join(","))).filter(Boolean).join(" ");
  let radarShown = null;
  function radarSVG(vals, prev, interactive, start) {
    let g = "";
    [5, 10, 15, 20].forEach((v) => { g += '<polygon points="' + ptsStr(Array(8).fill(v), Array(8).fill(false)) + '" fill="none" stroke="var(--line)" stroke-width="' + (v === 20 ? 1.5 : 1) + '"/>'; });
    DOMAINS.forEach((d, i) => { const [x, y] = pt(i, 20); g += '<line x1="' + RC + '" y1="' + RC + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="var(--line)"/>'; });
    if (interactive) DOMAINS.forEach((d, i) => {

    DOMAINS.forEach((d, i) => { const [x, y] = pt(i, s0[i]); g += '<circle' + (EXC[i] ? ' visibility="hidden"' : "") + ' id="rdot' + i + '" cx="' + x.toFixed(2) + '" cy="' + y.toFixed(2) + '" r="6" fill="' + d.color + '" stroke="var(--surface)" stroke-width="2" pointer-events="none"/>'; });
    DOMAINS.forEach((d, i) => {
      const x = RC + (RR + 46) * Math.cos(ang(i)), y = RC + (RR + 46) * Math.sin(ang(i));
      g += '<g class="radar-label"' + (interactive ? ' data-act="dom" data-id="' + d.id + '" role="button" tabindex="0" aria-label="تفاصيل الجانب ' + d.name + '"' : "") + '><text x="' + x.toFixed(1) + '" y="' + (y - 14).toFixed(1) + '" text-anchor="middle" font-size="17">' + d.icon +
        '</text><text x="' + x.toFixed(1) + '" y="' + (y + 6).toFixed(1) + '" text-anchor="middle" font-size="13.5" font-weight="600" fill="var(--ink)" font-family="IBM Plex Sans Arabic, Tahoma, sans-serif">' + d.name +
        '</text><text id="rsc' + i + '" x="' + x.toFixed(1) + '" y="' + (y + 24).toFixed(1) + '" text-anchor="middle" font-size="14" font-weight="700" fill="' + d.color + '" font-family="Reem Kufi, Tahoma, sans-serif">' + (EXC[i] ? "لا ينطبق" : vals[i] + " / 20") + "</text></g>";

    return '<svg viewBox="-12 -8 424 424" role="img" aria-label="عجلة الحياة: ' + DOMAINS.map((d, i) => d.name + " " + (EXC[i] ? "لا ينطبق" : vals[i])).join("، ") + '">' + g + "</svg>";
  }
  function setRadar(vals) {
    const poly = document.getElementById("rpoly"); if (!poly) return;
    poly.setAttribute("points", ptsStr(vals));
    vals.forEach((v, i) => { const c = document.getElementById("rdot" + i); if (c) { const [x, y] = pt(i, v); c.setAttribute("cx", x.toFixed(2)); c.setAttribute("cy", y.toFixed(2)); } });
  }
  function animateRadar(target) {
    const from = radarShown || target.map(() => 0);
    const D = REDUCE ? 0 : 750, t0 = performance.now();
    const step = (t) => {
      const k = D ? Math.min(1, (t - t0) / D) : 1, e = 1 - Math.pow(1 - k, 3);

  }

  function confetti() {

    const cols = DOMAINS.map((d) => d.color).concat(["#C9971E", "#7464E0"]);

      if (t - t0 < 2200) requestAnimationFrame(f); else ctx.clearRect(0, 0, W, H);

  /* ---------- screens ---------- */

  function md(t) {

      if ((m = L.match(/^#{1,4}\s+(.*)/))) { close(); out += "<h4>" + inl(m[1]) + "</h4>"; }
      else if ((m = L.match(/^[-•*]\s+(.*)/))) { if (list !== "ul") { close(); out += "<ul>"; list = "ul"; } out += "<li>" + inl(m[1]) + "</li>"; }

  const OFFLINE_NOTE = '<p class="small muted" style="margin:0">🔒 التحليل كله يعمل على جهازك: بلا إنترنت ولا اشتراك ولا ربط بأي خدمة، ولا تخرج إجاباتك من جهازك. المستشار هنا محرك تحليل مبني على قواعد واضحة تقرأ إجاباتك، وليس ذكاءً اصطناعياً.</p>';

  function streak(hid) {
    let n = 0; const d = new Date();
    if (!(S.plan.log[dayKey(d)] || {})[hid]) d.setDate(d.getDate() - 1);
    while ((S.plan.log[dayKey(d)] || {})[hid]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function commitment(p) {
    if (!S.plan.startedAt) return null;
    const days = Math.min(30, Math.max(1, daysBetween(S.plan.startedAt, Date.now()) + 1));
    const rate = { "يومياً": 1, "3 مرات أسبوعياً": 3 / 7, "مرتان أسبوعياً": 2 / 7 };
    let expected = p.week.length, done = p.week.filter((w) => S.plan.done[w.id]).length;
    p.habits.forEach((h) => {
      expected += Math.max(1, Math.round((rate[h.freq] || 1) * days));
      for (const k in S.plan.log) if (S.plan.log[k][h.id] && daysBetween(S.plan.startedAt, k) >= 0) done++;

    return Math.min(100, Math.round((done / expected) * 100));
  }

      '<p class="small" style="margin:0">مصممة لـ' + p.time.label + (S.time ? "" : " (افتراضي)") + " يومياً." + (p.time.id === "5" ? " الخطوات موزعة على الأسبوع واحدة تلو الأخرى." : "") + "</p>" +
      (S.plan.startedAt ? '<div class="meter" style="margin-top:12px"><span class="small">مؤشر الالتزام</span><div class="bar"><i style="width:' + cm + '%"></i></div><b>' + cm + '٪</b></div><p class="tiny muted" style="margin:4px 0 0">بدأت في ' + fmtDate(S.plan.startedAt) + "</p>" : '<button class="btn btn-gold btn-block" style="margin-top:12px" data-act="startPlan">ابدأ خطتي</button>') + "</div>" +
      '<div class="phase" style="margin-top:14px"><h3>المرحلة الأولى: 7 أيام <span class="ph-tag">حتى ' + fmtDate(p.dates.d7) + "</span></h3>" + p.week.map((w) => task(w, w.when + "، من سؤال: " + esc(w.from) + " (إجابتك: " + ansLabel(w.ans) + ")")).join("") + "</div>" +
      '<div class="phase" style="background:linear-gradient(135deg,var(--gold-soft),var(--surface))"><h3>⚡ تحدي هذا الأسبوع</h3><p style="margin:6px 0 0">' + esc(p.challenge) + "</p></div>" +
      '<div class="phase"><h3>المرحلة الثانية: 30 يوماً <span class="ph-tag">حتى ' + fmtDate(p.dates.d30) + '</span></h3><p style="margin:8px 0 4px"><b>الهدف:</b> ' + esc(p.goal) + '</p><p class="small muted" style="margin:0 0 4px">ثلاث عادات داعمة، سجّل ما أنجزته اليوم:</p>' +
      p.habits.map((h) => { const st = streak(h.id); return '<div class="task"><button class="check' + (today[h.id] ? " on" : "") + '" data-act="habit" data-id="' + h.id + '" aria-pressed="' + !!today[h.id] + '" aria-label="أنجزتها اليوم">✓</button><div class="t"><span>' + esc(h.text) + "</span><small>" + h.freq + (st ? "، 🔥 " + st + (st === 1 ? " يوم" : " أيام") + " متتالية" : "") + '</small><div class="days" aria-label="آخر 7 أيام">' + last7(h.id) + "</div></div></div>"; }).join("") + "</div>" +

  /* ---------- advisor ---------- */
  const SUGS = ["لماذا حصلت على هذه النتيجة؟", "كيف أطور الجانب الأضعف عندي؟", "أعطني خطة تناسب وقتي المحدود.", "كيف أوازن بين العمل والأسرة؟", "ما أول خطوة تنصحني أن أبدأ بها؟", "كيف أحافظ على نقاط قوتي؟", "أريد خطة أسبوعية قابلة للتطبيق."];
  function localReply(q, a, p) {

    const gapLines = (id, max) => { const s = a.scores[id], d = dom(id); return s.zeros.concat(s.ones).slice(0, max).map((i) => "- **" + d.qs[i].t.replace(/\.$/, "") + "** (" + ansLabel(S.answers[key(id, i)]) + "): " + d.qs[i].act).join("\n"); };
    if (has("لماذا", "ليش", "ليه", "سبب", "كيف حسبت", "حصلت", "طلعت", "جبت")) {

      if (id && a.scores[id].excluded) return "الجانب " + dom(id).name + " لم يُحتسب، لأنك اخترت «" + NA_LABEL + "» في " + a.scores[id].na + " من أسئلته. يمكنك تعديل ذلك من تفاصيل الجانب في تبويب النتيجة.";

      return (a.strong.length ? "نقاط قوتك الحالية:" : "لا يوجد جانب بلغ 16 بعد، وأقرب جوانبك لذلك:") + "\n" + ids.map((id) => { const s = a.scores[id], d = dom(id); return "- **الجانب " + d.name + " (" + s.score + "/20):** احمِ العادات التي اخترت فيها «يصفني»، مثل " + s.twos.slice(0, 2).map((i) => "«" + d.qs[i].t.replace(/\.$/, "") + "»").join(" و") + "."; }).join("\n") +
        "\n\nللمحافظة عليها: لا تضف عادات جديدة على حساب هذه العادات، وراجعها في تقييمك القادم. ويمكنك استثمار ما نجح معك فيها لدعم الجانب " + dom(a.bottom[0]).name + ".";

  function welcome(a) {

  function tabChat(a) {

      (S.chat.length ? '<button class="btn btn-ghost btn-block" data-act="clearChat" style="margin-top:6px">مسح المحادثة</button>' : "");
  }

  function sendChat(text) {
    text = String(text || "").trim(); if (!text) return;
    const a = an(), p = plan(a);

  /* ---------- progress ---------- */

      '<h3 class="sec-title">تطورك عبر التقييمات</h3><div class="card">' + cmp + "</div>" + reflect +
      (H.length ? '<div class="card"><b>سجل التقييمات</b>' + H.slice().reverse().map((h) => '<div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:8px 0;margin-top:6px"><span>' + fmtDate(h.date) + "</span><b>" + h.total + " / " + (h.max || 160) + "</b></div>" + (h.note ? '<p class="small muted" style="margin:0 0 6px;white-space:pre-line">' + esc(h.note) + "</p>" : "")).join("") + "</div>" : "") +
      '<h3 class="sec-title">موعد إعادة التقييم</h3><div class="card">' + (last ? "<p>مراجعة قصيرة: <b>" + fmtDate(d30) + "</b><br>إعادة تقييم كاملة: <b>" + fmtDate(d90) + '</b></p><p class="small muted">أضف التذكيرين إلى تقويم جوالك لتصلك تنبيهات في موعدهما. وعند فتح التطبيق بعد 30 يوماً ستظهر لك رسالة تذكير أيضاً.</p><button class="btn btn-soft btn-block" style="margin-bottom:10px" data-act="calendar">📅 أضف التذكير إلى تقويمي</button>' : "") +
      '<button class="btn btn-primary btn-block" data-act="reassess">إعادة تقييم عجلة حياتي</button></div>' +
      (curH ? '<h3 class="sec-title">ملخص جماعي (اختياري)</h3><div class="card"><p class="small" style="margin:0 0 10px">إذا طلب منك منسق مجموعتك (فريق، أسرة، مجموعة تطوير) المشاركة في ملخص جماعي، أنشئ كود نتيجتك وأرسله له. الكود لا يحتوي اسمك ولا أي معلومة شخصية، والمشاركة اختيارية تماماً.</p><button class="btn btn-ghost btn-block" data-act="myCode">أنشئ كود المشاركة</button></div>' : "") +

      '<button class="btn btn-ghost btn-block" style="margin-top:22px;color:var(--danger)" data-act="wipe">مسح جميع بياناتي من هذا الجهاز</button>';

  /* ---------- domain sheet ---------- */
  let sheetId = null;
  function openSheet(id) { sheetId = id; renderSheet(); }
  function renderSheet() {
    const id = sheetId; if (!id) return;
    const d = dom(id), s = LW.scoreDomains(S.answers)[id];
    const imp = [1, 2, 3].map((v) => '<button data-act="imp" data-v="' + v + '" class="' + (S.importance[id] === v ? "sel" : "") + '">' + IMPORTANCE[v] + "</button>").join("");
    const qs = d.qs.map((q, i) => { const k = key(id, i), v = S.answers[k]; const opts = q.na ? [0, 1, 2, "na"] : [0, 1, 2]; return '<div class="qedit"><div>' + (i + 1) + ". " + esc(q.t) + '</div><div class="seg3' + (q.na ? " seg4" : "") + '" style="--c:' + d.color + '">' + opts.map((x) => '<button data-act="edit" data-k="' + k + '" data-v="' + x + '" class="' + (v === x ? "sel" : "") + '" aria-pressed="' + (v === x) + '">' + (x === "na" ? "لا يخصني" : ANS[x]) + "</button>").join("") + "</div></div>"; }).join("");
    const html = '<div style="display:flex;align-items:center;gap:12px"><div class="qicon" style="background:color-mix(in srgb,' + d.color + ' 16%,transparent)">' + d.icon + '</div><div style="flex:1"><h3 style="font-size:21px;color:' + d.color + '">الجانب ' + d.name + '</h3><span class="chip ' + s.cat.key + '">' + s.cat.title + '</span></div><b style="font-family:var(--f-display);font-size:30px">' + (s.excluded ? "—" : s.score + '<span class="small muted">/20</span>') + "</b></div>" + (s.scaled ? '<p class="tiny muted" style="margin:6px 0 0">الدرجة محسوبة نسبةً إلى ' + s.applicable + " أسئلة تنطبق عليك.</p>" : "") +
      '<p style="margin-top:12px">' + s.cat.text + "</p>" +
      '<div class="card" style="padding:14px"><b>أهمية هذا الجانب لك الآن</b><div class="imp">' + imp + "</div></div>" +
      '<h4 style="margin:16px 0 4px;font-size:16px">إجاباتك (يمكنك تعديلها وستتحدث العجلة فوراً)</h4>' + qs +
      '<button class="btn btn-primary btn-block" data-act="closeSheet" style="margin-top:14px">تم</button>';
    let sc = document.getElementById("sheet");
    if (!sc) {
      sc = document.createElement("div"); sc.className = "scrim"; sc.id = "sheet";
      sc.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="تفاصيل الجانب"><div class="grab"></div><div id="sheetBody"></div></div>';
      sc.addEventListener("click", (e) => { if (e.target === sc) closeSheet(); });
      document.body.appendChild(sc);
    }
    const scrollEl = sc.querySelector(".sheet"), y = scrollEl.scrollTop;
    sc.querySelector("#sheetBody").innerHTML = html; scrollEl.scrollTop = y;
  }
  function closeSheet() { sheetId = null; const s = document.getElementById("sheet"); if (s) s.remove(); }

  /* ---------- session & history ---------- */
  function snapshot() { const a = an(), o = {}; DOMAINS.forEach((d) => { o[d.id] = a.scores[d.id].excluded ? null : a.scores[d.id].score; }); return { scores: o, total: a.total, max: a.maxTotal }; }
  function completeSession() {
    if (S.session.completedAt) { syncHistory(); return; }
    S.session.completedAt = Date.now();
    const sn = snapshot(); S.history.push({ id: S.session.id, date: S.session.completedAt, scores: sn.scores, total: sn.total, max: sn.max });
    award("complete"); if (S.history.length >= 2) award("reassess"); checkGrowth(); S.celebrated = false; save();
  }
  function syncHistory() {
    if (!S.session.completedAt) return;
    const h = S.history.find((x) => x.id === S.session.id); if (!h) return;
    const sn = snapshot(); h.scores = sn.scores; h.total = sn.total; h.max = sn.max; checkGrowth();
  }
  function checkGrowth() {
    const H = S.history; if (H.length < 2) return;
    const cur = H[H.length - 1], prev = H[H.length - 2];
    if (DOMAINS.some((d) => cur.scores[d.id] != null && prev.scores[d.id] != null && cur.scores[d.id] > prev.scores[d.id])) award("growth");
  }
  function newSession() {
    Object.assign(S, { answers: {}, extra: {}, pos: { mode: "core", idx: 0 }, session: { id: Date.now(), completedAt: null }, plan: { startedAt: null, done: {}, log: {} }, chat: [], aiReport: null, celebrated: false, tab: "summary", transFor: null });
    radarShown = null; S.screen = "guide"; save(); render();
  }
  const firstUnanswered = () => { for (let i = 0; i < 80; i++) { const d = DOMAINS[Math.floor(i / 10)]; if (S.answers[key(d.id, i % 10)] === undefined) return i; } return -1; };
  function finishCore() {
    const f = firstUnanswered();
    if (f >= 0) { S.pos = { mode: "core", idx: f }; S.screen = "quiz"; toast("بقيت أسئلة لم تُجب عنها"); save(); render(); return; }
    completeSession(); S.screen = "done"; save(); render();
  }
  function goResults(tab) {
    if (answered() < 80) { finishCore(); return; }
    completeSession(); S.screen = "results"; if (tab) S.tab = tab; save(); render();
    if (!S.celebrated) { S.celebrated = true; save(); confetti(); }
  }

  /* ---------- report export ---------- */
  function shareText(a, p) {
    return "عجلة حياتي: " + a.total + " من " + a.maxTotal + " (" + a.percent + "٪)\n" + DOMAINS.map((d) => d.icon + " " + d.name + ": " + (a.scores[d.id].excluded ? "لا ينطبق" : a.scores[d.id].score + "/20")).join("\n") +
      "\nنقاط القوة: " + (a.strong.length ? a.strong.map((id) => dom(id).name).join("، ") : "لا يوجد بعد") + "\nأولويتي الآن: الجانب " + dom(a.prio).name + "\nأول خطوة: " + p.week[0].text + "\n\nمن «تمرين عجلة الحياة»";
  }
  function reportBody() {
    const a = an(), p = plan(a), r = a.report;
    return "<h1>تقرير تمرين عجلة الحياة</h1><p>" + fmtDate(Date.now()) + "</p>" +
      "<h2>اكتملت رحلتك... وهذه صورة توازنك الحالي</h2><p><b>" + a.total + " من " + a.maxTotal + "</b> (" + a.percent + "٪)، مؤشر التوازن " + a.balance + "٪</p>" +
      '<div class="rsvg">' + radarSVG(vals(a), null, false).replace(/var\(--line\)/g, "#d5d9e8").replace(/var\(--violet\)/g, "#7464E0").replace(/var\(--surface\)/g, "#fff").replace(/var\(--ink\)/g, "#141B3A") + "</div>" +
      "<table><thead><tr><th>الجانب</th><th>الدرجة</th><th>التصنيف</th></tr></thead><tbody>" + DOMAINS.map((d) => "<tr><td>" + d.icon + " " + d.name + "</td><td>" + (a.scores[d.id].excluded ? "—" : a.scores[d.id].score + " / 20") + "</td><td>" + a.scores[d.id].cat.title + "</td></tr>").join("") + "</tbody></table>" +
      (a.extraAnswered === 10 ? "<p>مقياس الوعي والأولويات (إضافي): " + a.extraTotal + " / 20، " + LW.extraCat(a.extraTotal) + "</p>" : "") +
      "<h2>الصورة العامة</h2><p>" + esc(r.general) + "</p><h2>نقاط القوة</h2><p>" + esc(r.strengths) + "</p><h2>الجوانب التي تحتاج إلى اهتمام</h2><p>" + esc(r.attention) + "</p>" +
      (r.note.length ? "<h2>ملاحظة قد لا تنتبه لها</h2>" + r.note.map((n) => "<p>" + esc(n) + "</p>").join("") : "") +
      "<h2>الأولوية المقترحة</h2><p>" + esc(r.priority) + "</p>" +
      "<h2>خطتك الشخصية لاستعادة التوازن</h2><p><b>7 أيام:</b></p><ol>" + p.week.map((w) => "<li>" + esc(w.text) + "</li>").join("") + "</ol><p><b>هدف 30 يوماً:</b> " + esc(p.goal) + "</p><ul>" + p.habits.map((h) => "<li>" + esc(h.text) + " (" + h.freq + ")</li>").join("") + "</ul><p><b>مراجعة 90 يوماً (" + fmtDate(p.dates.d90) + "):</b></p><ul>" + p.review.map((x) => "<li>" + esc(x.text) + "</li>").join("") + "</ul>" +
      "<p style=\"margin-top:18px;font-style:italic\">تذكّر أن عجلة الحياة لا تحتاج إلى أن تكون مثالية حتى تتحرك، لكنها تحتاج إلى قدر من التوازن والوعي. لا تقارن رحلتك برحلة الآخرين، بل قارن واقعك اليوم بما تستطيع أن تحققه غداً. كل تغيير صغير ومستمر قد يصنع فرقاً كبيراً مع مرور الوقت.</p>" +
      '<p style="font-size:12px;color:#666">هذا التمرين أداة للتأمل والتطوير الذاتي، وليس اختباراً نفسياً أو حكماً نهائياً على جودة حياتك.</p>';
  }
  function doPrint() {
    const pr = document.getElementById("print"); pr.innerHTML = reportBody();
    document.body.classList.add("printing");
    const off = () => document.body.classList.remove("printing");
    window.addEventListener("afterprint", off, { once: true });
    try { window.print(); } catch (e) { toast("الطباعة غير متاحة هنا. استخدم «تنزيل التقرير» ثم اطبعه من المتصفح."); }
    setTimeout(off, 3000);
  }
  async function doDownload() {
    const html = '<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير عجلة الحياة</title><style>body{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;color:#141B3A;max-width:760px;margin:0 auto;padding:24px;line-height:1.8}h1{font-size:26px}h2{font-size:19px;margin:22px 0 6px;border-bottom:1px solid #e3e6f0;padding-bottom:4px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #e3e6f0;padding:6px 8px;text-align:start}p{white-space:pre-line}.rsvg{max-width:380px;margin:0 auto}svg{width:100%;height:auto}@media print{body{padding:0}}</style></head><body>' + reportBody() + "</body></html>";
    try {
      const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
      const l = document.createElement("a"); l.href = url; l.download = "taqrir-ajalat-alhayah.html"; document.body.appendChild(l); l.click(); l.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast("تم تنزيل التقرير. افتحه واطبعه أو احفظه PDF.");
    } catch (e) { toast("التنزيل غير متاح هنا. استخدم زر الطباعة."); }
  }
  async function doShare() {
    const a = an(), t = shareText(a, plan(a));
    try { if (navigator.share) { await navigator.share({ title: "عجلة حياتي", text: t }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(t); toast("نُسخ ملخص النتيجة، الصقه أينما تريد."); return; } catch (e) {}
    modal('<h3 style="font-size:19px">ملخص نتيجتك</h3><p class="small muted">انسخ النص وشاركه:</p><textarea class="field" style="min-height:220px" readonly id="shareTxt">' + esc(t) + '</textarea><button class="btn btn-primary btn-block" style="margin-top:10px" data-act="closeModal">تم</button>', (m) => { const ta = m.querySelector("#shareTxt"); ta.focus(); ta.select(); });
  }

  /* ---------- render ---------- */
  function render(opts) {
    opts = opts || {};
    const y = window.scrollY;
    if (S.screen === "results" && answered() < 80) S.screen = "home";
    if (S.screen === "trans" && S.transFor == null) S.screen = "quiz";
    $app.innerHTML = (SCREENS[S.screen] || SCREENS.home)();
    applyTheme();
    if (S.screen === "results" && S.tab === "summary") animateRadar(vals(an()));
    if (S.screen === "results" && S.tab === "chat") { const c = document.getElementById("chat"); if (c && !opts.noScroll && S.chat.length) c.lastElementChild.scrollIntoView({ block: "end" }); }
    if (opts.keepScroll) window.scrollTo(0, y); else if (!opts.noScroll && !(S.tab === "chat" && S.chat.length)) window.scrollTo(0, 0);
    if (sheetId) renderSheet();
  }

  /* ---------- actions ---------- */
  const A = {
    home() { closeSheet(); S.screen = "home"; save(); render(); },
    theme() { S.theme = S.theme === "auto" ? "dark" : S.theme === "dark" ? "light" : "auto"; save(); applyTheme(); const b = document.querySelector('[data-act="theme"]'); if (b) b.textContent = themeIcon(); toast(S.theme === "auto" ? "المظهر: تلقائي" : S.theme === "dark" ? "المظهر: داكن" : "المظهر: فاتح"); },
    guide() { S.screen = "guide"; save(); render(); },
    begin() { const f = firstUnanswered(); if (f < 0) { goResults(); return; } S.pos = { mode: "core", idx: f }; dir = 1; S.screen = "quiz"; save(); render(); },
    resume() { A.begin(); },
    retake() { confirmBox("ستبدأ تقييماً جديداً من البداية. تبقى تقييماتك المكتملة السابقة محفوظة للمقارنة.", "ابدأ من جديد", newSession); },
    reassess() { confirmBox("إعادة تقييم عجلة حياتك تبدأ جولة جديدة من 80 سؤالاً، ثم تقارن نتيجتك الجديدة بالسابقة.", "ابدأ إعادة التقييم", newSession); },
    confirmYes() { const cb = confirmCb; confirmCb = null; closeModal(); if (cb) cb(); },
    closeModal() { closeModal(); },
    ans(el) {
      if (lock) return; const v = el.dataset.v === "na" ? "na" : +el.dataset.v, q = curQ();
      if (S.pos.mode === "core") S.answers[q.k] = v; else S.extra[q.k] = v;
      save();
      document.querySelectorAll(".opt").forEach((b) => { b.classList.remove("sel", "pop"); b.setAttribute("aria-pressed", "false"); });
      el.classList.add("sel", "pop"); el.setAttribute("aria-pressed", "true");
      lock = true; setTimeout(() => { lock = false; A.next(); }, REDUCE ? 120 : 300);
    },
    next() {
      const q = curQ(); if (q.val === undefined && (S.pos.mode === "core" ? S.answers[q.k] : S.extra[q.k]) === undefined) return;
      dir = 1;
      if (S.pos.mode === "core") {
        if (S.pos.idx % 10 === 9) { S.transFor = Math.floor(S.pos.idx / 10); S.screen = "trans"; }
        else S.pos.idx++;
      } else {
        if (S.pos.idx === 9) { if (Object.keys(S.extra).length === 10) award("extra"); goResults("summary"); return; }
        S.pos.idx++;
      }
      save(); render();
    },
    prev() {
      dir = -1;
      if (S.pos.idx > 0) S.pos.idx--;
      else if (S.pos.mode === "extra") { S.screen = isComplete() ? "results" : "done"; }
      save(); render();

  /* ---------- calendar reminders (.ics) ---------- */
  const icsEsc = (t) => String(t).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  function icsFold(line) {
    let out = "", cur = "", bytes = 0;
    for (const ch of line) { const b = encodeURIComponent(ch).replace(/%[0-9A-F]{2}/gi, "x").length; if (bytes + b > 73) { out += cur + "\r\n "; cur = ""; bytes = 1; } cur += ch; bytes += b; }
    return out + cur;
  }
  const icsDay = (d) => { const x = new Date(d); return x.getFullYear() + String(x.getMonth() + 1).padStart(2, "0") + String(x.getDate()).padStart(2, "0"); };
  function buildICS() {
    const a = an(), base = S.session.completedAt || Date.now(), pr = "الجانب " + dom(a.prio).name;
    const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
    const ev = (n, title, desc) => { const d = icsDay(LW.addDays(base, n)); return ["BEGIN:VEVENT", "UID:ajalat-" + S.session.id + "-" + n + "@ajalat-alhayah", "DTSTAMP:" + stamp, "DTSTART:" + d + "T090000", "DTEND:" + d + "T093000", "SUMMARY:" + icsEsc(title), "DESCRIPTION:" + icsEsc(desc), "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(title), "TRIGGER:-PT0M", "END:VALARM", "END:VEVENT"]; };
    const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Ajalat Alhayah//AR", "CALSCALE:GREGORIAN", "METHOD:PUBLISH"]
      .concat(ev(30, "مراجعة عجلة الحياة (30 يوماً)", "راجع خطتك في " + pr + ". نتيجتك عند التقييم: " + a.total + " من " + a.maxTotal + "."))
      .concat(ev(90, "إعادة تقييم عجلة الحياة (90 يوماً)", "افتح تمرين عجلة الحياة واضغط «إعادة تقييم عجلة حياتي» لتقارن تقدمك. نتيجتك السابقة: " + a.total + " من " + a.maxTotal + "."))
      .concat(["END:VCALENDAR"]);
    return lines.map(icsFold).join("\r\n") + "\r\n";
  }

  function loadTeam() { try { const o = JSON.parse(localStorage.getItem(TSTORE) || "null"); if (o && o.codes) return o; } catch (e) {} return { codes: {} }; }

  function parseCodes(text) {
    const out = []; let m; CODE_RE.lastIndex = 0;
    while ((m = CODE_RE.exec(String(text)))) { const ans = m[3]; if ([...ans].some((c, i) => c === "n" && !NA_POS[i])) continue; out.push({ id: m[1], month: m[2], ans, ex: m[4], raw: m[0] }); }
    return out;
  }
  function decodeAns(p) { const o = {}; let k = 0; DOMAINS.forEach((d) => d.qs.forEach((_, i) => { const c = p.ans[k++]; o[key(d.id, i)] = c === "n" ? "na" : +c; })); return o; }
  function myCode() {
    if (!S.session.code) { let r = ""; const al = "abcdefghijklmnopqrstuvwxyz0123456789"; try { const b = crypto.getRandomValues(new Uint8Array(6)); b.forEach((x) => { r += al[x % 36]; }); } catch (e) { for (let i = 0; i < 6; i++) r += al[(Math.random() * 36) | 0]; } S.session.code = r; save(); }
    const ans = DOMAINS.map((d) => d.qs.map((_, i) => { const v = S.answers[key(d.id, i)]; return v === "na" ? "n" : String(v); }).join("")).join("");
    const ex = EXTRA.map((_, i) => (S.extra[i] === undefined ? "-" : String(S.extra[i]))).join("");

    if (!ps.length) return res;
    const all = ps.map((p) => ({ p, a: LW.analyze({ answers: decodeAns(p) }) }));
    DOMAINS.forEach((d) => {
      const list = all.filter((x) => !x.a.scores[d.id].excluded).map((x) => x.a.scores[d.id]);
      const avg = list.length ? list.reduce((s, x) => s + x.score, 0) / list.length : 0;
      res.dom[d.id] = { avg: Math.round(avg * 10) / 10, count: list.length, attn: list.filter((x) => x.cat.key === "attn").length, grow: list.filter((x) => x.cat.key === "grow").length, strong: list.filter((x) => x.cat.key === "strong").length };
    });
    let k = 0;
    DOMAINS.forEach((d) => d.qs.forEach((q, i) => {
      const vals = ps.map((p) => p.ans[k]).filter((c) => c !== "n"); k++;
      if (vals.length) res.qs.push({ d, i, t: q.t, n: vals.length, no: vals.filter((c) => c === "0").length / vals.length, yes: vals.filter((c) => c === "2").length / vals.length });
    }));

  }
